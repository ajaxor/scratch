<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09191e"><title>Hollowmere</title>
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#09191e;color:#e5e7db;font:16px/1.6 system-ui;text-align:center}main{max-width:30rem;padding:2rem}h1{font:3rem Georgia;color:#e7bd74}button{padding:14px 24px;background:#e7bd74;color:#09191e;border:0;border-radius:4px;font:inherit}button[hidden]{display:none}</style></head>
<body><main><h1>Hollowmere</h1><p id="loader-status" role="status">Checking for the latest version…</p><button id="retry" hidden>Try again</button><noscript>Enable JavaScript to enter Hollowmere.</noscript></main>
<script>
(async function load(){
 const base=new URL('./',location.href),status=document.getElementById('loader-status'),retry=document.getElementById('retry');
 retry.hidden=true;retry.onclick=()=>location.reload();
 try{
  const manifestURL=new URL('release.json',base);manifestURL.searchParams.set('check',Date.now()+'-'+Math.random().toString(36).slice(2));
  const response=await fetch(manifestURL,{cache:'no-store',signal:AbortSignal.timeout(15000)});
  if(!response.ok)throw Error('Release check failed');
  const release=await response.json();
  if(!/^[a-f0-9]{16}$/.test(release.build)||!/^\d+\.\d+\.\d+$/.test(release.version))throw Error('Invalid release');
  status.textContent='Loading version '+release.version+'…';
  const entry=new URL('releases/'+release.build+'/index.html',base);
  const page=await fetch(entry,{cache:'no-store',signal:AbortSignal.timeout(15000)});
  if(!page.ok)throw Error('Release is still publishing');
  let html=await page.text();
  if(!html.includes('content="'+release.build+'"'))throw Error('Release mismatch');
  html=html.replace('<head>','<head><base href="'+new URL('./',entry).href+'">');
  // Keep the stable launcher address while parsing a complete, version-pinned document.
  document.open();document.write(html);document.close();
 }catch(error){
  status.textContent='Could not load the latest version. Check your connection and try again. Your saved journey is safe.';
  retry.hidden=false;
 }
})();
</script></body></html>
